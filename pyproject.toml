[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-app-proxy"
version = "0.2.0"
description = "Local Messages API gateway and transparent token relay for Microsoft Copilot App."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy==12.3.1",
    "aiohttp>=3.11",
    "msal>=1.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
copilot-proxy = "copilot_app_proxy.__main__:main"

[tool.setuptools.packages.find]
include = ["copilot_app_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
